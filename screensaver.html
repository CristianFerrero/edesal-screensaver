<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDESAL Energía — Screensaver</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; cursor: none; }
  canvas#three-canvas { position: fixed; top: 0; left: 0; z-index: 1; }

  /* Logo image floating in center */
  #logo-container {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
    pointer-events: none;
  }
  #logo-img {
    max-width: 55vmin;
    max-height: 55vmin;
    object-fit: contain;
    filter: drop-shadow(0 0 40px rgba(74, 125, 255, 0.5))
            drop-shadow(0 0 80px rgba(74, 125, 255, 0.25));
    animation: logoFloat 6s ease-in-out infinite, logoFadeIn 3s ease-out forwards;
    opacity: 0;
  }
  @keyframes logoFloat {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-12px) scale(1.02); }
  }
  @keyframes logoFadeIn {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: scale(1); }
  }

  /* Pulsing glow behind logo */
  #glow-ring {
    position: fixed;
    top: 50%; left: 50%;
    width: 60vmin; height: 60vmin;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    z-index: 5;
    pointer-events: none;
    animation: glowPulse 4s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% {
      box-shadow: 0 0 60px 20px rgba(74, 125, 255, 0.12),
                  0 0 120px 40px rgba(74, 125, 255, 0.06),
                  inset 0 0 60px 20px rgba(74, 125, 255, 0.05);
    }
    50% {
      box-shadow: 0 0 80px 30px rgba(74, 125, 255, 0.25),
                  0 0 160px 60px rgba(74, 125, 255, 0.12),
                  inset 0 0 80px 30px rgba(74, 125, 255, 0.1);
    }
  }
</style>
</head>
<body>

<!-- Logo real del usuario -->
<div id="glow-ring"></div>
<div id="logo-container">
  <img id="logo-img" src="logo.png" alt="EDESAL Energía"
       onerror="this.src='logo.jpg'; this.onerror=function(){this.src='logo.webp';};">
</div>

<canvas id="three-canvas"></canvas>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const canvas = document.getElementById('three-canvas');

// ── Scene ──
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(0, 0, 30);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

// ── Bloom ──
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight), 1.5, 0.4, 0.85
);
bloom.threshold = 0.1;
bloom.strength = 1.8;
bloom.radius = 0.7;
composer.addPass(bloom);

// ── Electric particle system orbiting the logo ──
const particleCount = 3000;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(particleCount * 3);
const pCol = new Float32Array(particleCount * 3);
const pVel = []; // velocity data
const pLife = new Float32Array(particleCount);

for (let i = 0; i < particleCount; i++) {
  // Distribute in a shell around center
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = 8 + Math.random() * 15;
  pPos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
  pPos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
  pPos[i * 3 + 2] = r * Math.cos(phi) - 5;

  pVel.push({
    theta: theta,
    phi: phi,
    r: r,
    speed: 0.1 + Math.random() * 0.3,
    drift: (Math.random() - 0.5) * 0.01,
  });

  pLife[i] = Math.random();

  // Blue / white palette
  const c = Math.random();
  if (c < 0.4) {
    pCol[i * 3] = 0.29; pCol[i * 3 + 1] = 0.49; pCol[i * 3 + 2] = 1.0;
  } else if (c < 0.7) {
    pCol[i * 3] = 0.5; pCol[i * 3 + 1] = 0.65; pCol[i * 3 + 2] = 1.0;
  } else if (c < 0.9) {
    pCol[i * 3] = 0.8; pCol[i * 3 + 1] = 0.85; pCol[i * 3 + 2] = 1.0;
  } else {
    pCol[i * 3] = 1.0; pCol[i * 3 + 1] = 1.0; pCol[i * 3 + 2] = 1.0;
  }
}

pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));

const pMat = new THREE.PointsMaterial({
  size: 0.12,
  vertexColors: true,
  transparent: true,
  opacity: 0.75,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  sizeAttenuation: true,
});
const particles = new THREE.Points(pGeo, pMat);
scene.add(particles);

// ── Orbiting energy rings ──
function makeOrbitRing(radius, tubeR, color, opacity) {
  const geo = new THREE.TorusGeometry(radius, tubeR, 24, 120);
  const mat = new THREE.MeshBasicMaterial({
    color, transparent: true, opacity,
    blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  });
  return new THREE.Mesh(geo, mat);
}

const orbitRings = [];
const ringConfigs = [
  { r: 11, tube: 0.04, color: 0x4a7dff, opacity: 0.25 },
  { r: 13, tube: 0.03, color: 0x3366dd, opacity: 0.18 },
  { r: 15.5, tube: 0.025, color: 0x2255bb, opacity: 0.12 },
  { r: 18, tube: 0.02, color: 0x1144aa, opacity: 0.08 },
];
ringConfigs.forEach(c => {
  const ring = makeOrbitRing(c.r, c.tube, c.color, c.opacity);
  scene.add(ring);
  orbitRings.push(ring);
});

// ── Electric arc bolts (brief flashes) ──
function createArcBolt() {
  const pts = [];
  const segs = 20;
  const angle = Math.random() * Math.PI * 2;
  const rStart = 6;
  const rEnd = 12 + Math.random() * 6;
  for (let i = 0; i < segs; i++) {
    const t = i / (segs - 1);
    const r = rStart + (rEnd - rStart) * t;
    const jitter = (1 - t) * 2;
    pts.push(new THREE.Vector3(
      Math.cos(angle) * r + (Math.random() - 0.5) * jitter,
      Math.sin(angle) * r + (Math.random() - 0.5) * jitter,
      (Math.random() - 0.5) * jitter * 0.5
    ));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  const geo = new THREE.TubeGeometry(curve, 20, 0.035, 5, false);
  const mat = new THREE.MeshBasicMaterial({
    color: 0x88bbff,
    transparent: true,
    opacity: 0.8,
    blending: THREE.AdditiveBlending,
  });
  return new THREE.Mesh(geo, mat);
}

const arcPool = [];
for (let i = 0; i < 6; i++) {
  const arc = createArcBolt();
  arc.visible = false;
  scene.add(arc);
  arcPool.push({ mesh: arc, timer: 1 + Math.random() * 4 });
}

// ── Floating energy motes (closer to logo) ──
const moteCount = 200;
const moteGeo = new THREE.BufferGeometry();
const motePos = new Float32Array(moteCount * 3);
const moteCol = new Float32Array(moteCount * 3);
const moteData = [];

for (let i = 0; i < moteCount; i++) {
  const angle = Math.random() * Math.PI * 2;
  const r = 4 + Math.random() * 7;
  motePos[i * 3] = Math.cos(angle) * r;
  motePos[i * 3 + 1] = Math.sin(angle) * r;
  motePos[i * 3 + 2] = (Math.random() - 0.5) * 3;

  moteCol[i * 3] = 0.4 + Math.random() * 0.6;
  moteCol[i * 3 + 1] = 0.5 + Math.random() * 0.5;
  moteCol[i * 3 + 2] = 1.0;

  moteData.push({
    angle, r, z: motePos[i * 3 + 2],
    speed: 0.15 + Math.random() * 0.35,
    bobSpeed: 0.5 + Math.random() * 1.5,
    bobAmp: 0.3 + Math.random() * 0.7,
  });
}
moteGeo.setAttribute('position', new THREE.BufferAttribute(motePos, 3));
moteGeo.setAttribute('color', new THREE.BufferAttribute(moteCol, 3));

const moteMat = new THREE.PointsMaterial({
  size: 0.25,
  vertexColors: true,
  transparent: true,
  opacity: 0.9,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  sizeAttenuation: true,
});
const motes = new THREE.Points(moteGeo, moteMat);
scene.add(motes);

// ── Background deep stars ──
const starCount = 2000;
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  starPos[i * 3]     = (Math.random() - 0.5) * 200;
  starPos[i * 3 + 1] = (Math.random() - 0.5) * 200;
  starPos[i * 3 + 2] = -30 - Math.random() * 100;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const starMat = new THREE.PointsMaterial({
  color: 0x223355, size: 0.08, transparent: true, opacity: 0.4,
});
scene.add(new THREE.Points(starGeo, starMat));

// ── Animation loop ──
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // ── Particles: orbit around center ──
  const posArr = pGeo.attributes.position.array;
  for (let i = 0; i < particleCount; i++) {
    const v = pVel[i];
    v.theta += v.speed * 0.005;
    v.phi += v.drift;
    const wobble = Math.sin(t * 0.5 + i * 0.01) * 0.3;
    const r = v.r + wobble;
    posArr[i * 3]     = r * Math.sin(v.phi) * Math.cos(v.theta);
    posArr[i * 3 + 1] = r * Math.sin(v.phi) * Math.sin(v.theta);
    posArr[i * 3 + 2] = r * Math.cos(v.phi) - 5;
  }
  pGeo.attributes.position.needsUpdate = true;

  // ── Motes: orbit closer ──
  const mp = moteGeo.attributes.position.array;
  for (let i = 0; i < moteCount; i++) {
    const d = moteData[i];
    d.angle += d.speed * 0.008;
    const rr = d.r + Math.sin(t * 0.3 + i) * 0.5;
    mp[i * 3]     = Math.cos(d.angle) * rr;
    mp[i * 3 + 1] = Math.sin(d.angle) * rr;
    mp[i * 3 + 2] = d.z + Math.sin(t * d.bobSpeed + i) * d.bobAmp;
  }
  moteGeo.attributes.position.needsUpdate = true;

  // ── Orbit rings ──
  orbitRings.forEach((ring, i) => {
    const tilt = 0.4 + i * 0.25;
    ring.rotation.x = tilt + Math.sin(t * 0.15 + i * 1.5) * 0.15;
    ring.rotation.y = t * (0.05 + i * 0.02);
    ring.rotation.z = Math.sin(t * 0.1 + i * 2) * 0.1;
    ring.material.opacity = ringConfigs[i].opacity + Math.sin(t * 1.2 + i) * 0.04;
  });

  // ── Electric arcs flash ──
  arcPool.forEach(a => {
    a.timer -= 0.016;
    if (a.timer <= 0) {
      if (a.mesh.visible) {
        a.mesh.visible = false;
        a.timer = 1.5 + Math.random() * 4;
      } else {
        scene.remove(a.mesh);
        a.mesh.geometry.dispose();
        a.mesh.material.dispose();
        a.mesh = createArcBolt();
        scene.add(a.mesh);
        a.mesh.visible = true;
        a.timer = 0.04 + Math.random() * 0.12;
      }
    }
  });

  // ── Subtle camera sway ──
  camera.position.x = Math.sin(t * 0.07) * 1.5;
  camera.position.y = Math.sin(t * 0.09) * 1.0;
  camera.lookAt(0, 0, 0);

  // ── CSS glow sync ──
  const glowIntensity = 0.12 + Math.sin(t * 1.5) * 0.08;
  document.getElementById('glow-ring').style.opacity = 0.6 + Math.sin(t * 1.5) * 0.4;

  // Logo subtle drop-shadow pulse
  const shadowSize = 40 + Math.sin(t * 2) * 15;
  const shadowAlpha = 0.4 + Math.sin(t * 2) * 0.2;
  document.getElementById('logo-img').style.filter =
    `drop-shadow(0 0 ${shadowSize}px rgba(74, 125, 255, ${shadowAlpha}))
     drop-shadow(0 0 ${shadowSize * 2}px rgba(74, 125, 255, ${shadowAlpha * 0.5}))`;

  composer.render();
}

animate();

// ── Resize ──
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
