<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORION — SERVIDOR IA — LIVE</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100vh; width:100vw; overflow:hidden; }
  body { background:#000; color:#fff; font-family:'Courier New',monospace; }
  canvas#three-canvas { position:fixed; top:0; left:0; z-index:1; }

  .back-btn {
    position:fixed; top:15px; left:15px; z-index:30;
    padding:8px 14px;
    background:rgba(2,8,25,0.88);
    border:1px solid rgba(140,80,220,0.6);
    color:#d0a0ff;
    font-family:'Courier New',monospace; font-size:11px; letter-spacing:2px;
    text-decoration:none; border-radius:6px;
    backdrop-filter:blur(8px);
    box-shadow:0 0 10px rgba(140,80,220,0.3);
  }
  .back-btn:hover { background:rgba(140,80,220,0.25); }

  /* Brand mark (top-right) */
  .brand-mark {
    position:fixed; top:15px; right:20px; z-index:30;
    font-size:10px; letter-spacing:3px; color:rgba(200,160,255,0.5);
    display:flex; align-items:center; gap:8px;
  }
  .brand-mark .live-led {
    width:8px; height:8px; border-radius:50%;
    background:#ff5555; box-shadow:0 0 10px #ff5555;
    animation:livePulse 1.4s infinite;
  }
  @keyframes livePulse { 50% { opacity:0.4; transform:scale(0.8); } }
  .brand-mark .brand-title {
    font-size:12px; color:#d0a0ff; font-weight:700; letter-spacing:5px;
    text-shadow:0 0 8px rgba(180,120,255,0.5);
  }

  .dashboard {
    position:relative; z-index:10;
    height:100vh;
    max-width:1900px;
    margin:0 auto;
    padding:42px 20px 18px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  /* Top stat strip */
  .stat-strip {
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:12px;
    flex-shrink:0;
  }
  .stat-tile {
    position:relative;
    padding:12px 16px;
    background:rgba(2,8,25,0.78);
    border:1px solid rgba(140,80,220,0.45);
    border-radius:10px;
    overflow:hidden;
    display:flex; align-items:center; gap:14px;
    backdrop-filter:blur(10px);
    animation:fadeIn 0.6s ease-out forwards; opacity:0;
  }
  .stat-tile:nth-child(1) { animation-delay:0.05s; }
  .stat-tile:nth-child(2) { animation-delay:0.12s; }
  .stat-tile:nth-child(3) { animation-delay:0.19s; }
  .stat-tile:nth-child(4) { animation-delay:0.26s; }
  .stat-tile:nth-child(5) { animation-delay:0.33s; }
  @keyframes fadeIn { to { opacity:1; } }
  .stat-tile::before {
    content:''; position:absolute; top:0; left:8%; right:8%; height:1px;
    background:linear-gradient(90deg,transparent,rgba(210,150,255,0.9),transparent);
  }
  .stat-tile .led {
    width:10px; height:10px; border-radius:50%;
    background:#80ffb0; box-shadow:0 0 10px #80ffb0;
    animation:ledBlink 2s infinite;
    flex-shrink:0;
  }
  @keyframes ledBlink { 50% { opacity:0.3; } }
  .stat-tile .tbody { flex:1; min-width:0; }
  .stat-tile .label {
    font-size:9px; letter-spacing:2.5px; color:rgba(200,160,255,0.7); margin-bottom:3px;
  }
  .stat-tile .value {
    font-size:28px; font-weight:700; color:#d0a0ff; line-height:1;
    text-shadow:0 0 10px rgba(180,120,255,0.7);
    font-variant-numeric:tabular-nums;
  }
  .stat-tile .unit {
    font-size:9px; letter-spacing:1.5px; color:rgba(200,160,255,0.5); margin-top:3px;
  }
  .stat-tile.warn .led { background:#ffc060; box-shadow:0 0 10px #ffc060; }
  .stat-tile.warn .value { color:#ffc060; text-shadow:0 0 10px rgba(255,180,60,0.7); }
  .stat-tile.ok .led { background:#80ffb0; }
  .stat-tile.ok .value { color:#c0e878; text-shadow:0 0 10px rgba(150,220,80,0.7); }

  /* Main row */
  .main-row {
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns: 240px 1fr 240px;
    gap:12px;
  }
  .viz-card {
    position:relative;
    background:rgba(2,8,25,0.78);
    border:1px solid rgba(140,80,220,0.45);
    border-radius:12px;
    overflow:hidden;
    display:flex; flex-direction:column;
    backdrop-filter:blur(10px);
    animation:fadeIn 0.8s ease-out forwards; opacity:0;
  }
  .viz-card:nth-child(1) { animation-delay:0.4s; }
  .viz-card:nth-child(2) { animation-delay:0.45s; }
  .viz-card:nth-child(3) { animation-delay:0.5s; }
  .viz-card::before {
    content:''; position:absolute; top:0; left:8%; right:8%; height:1px;
    background:linear-gradient(90deg,transparent,rgba(210,150,255,0.9),transparent);
  }
  .mini-header {
    padding:9px 14px;
    font-size:10px; letter-spacing:3px; font-weight:700;
    color:#c080ff;
    border-bottom:1px solid rgba(140,80,220,0.2);
    text-shadow:0 0 6px rgba(180,120,255,0.5);
    flex-shrink:0;
    display:flex; justify-content:space-between; align-items:center;
  }
  .mini-header .hz {
    font-size:8px; color:rgba(200,160,255,0.5); letter-spacing:1.5px;
    font-weight:400;
  }

  /* Inputs list */
  .inputs-list {
    padding:10px; display:flex; flex-direction:column; gap:7px; flex:1;
  }
  .input-row {
    display:flex; align-items:center; gap:8px;
    padding:7px 10px;
    background:rgba(74,125,255,0.06);
    border:1px solid rgba(120,180,255,0.22);
    border-radius:6px;
    position:relative;
    overflow:hidden;
    font-size:10.5px;
  }
  .input-row .icon {
    width:20px; text-align:center; font-size:14px; color:#80b8ff;
    flex-shrink:0;
  }
  .input-row .name {
    flex:1; letter-spacing:1px; color:#a8d4ff; font-size:10px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .input-row .val {
    font-weight:700; color:#80b8ff; font-variant-numeric:tabular-nums;
    text-shadow:0 0 5px rgba(120,180,255,0.6);
    min-width:56px; text-align:right;
  }
  .input-row .pulse {
    position:absolute; top:0; left:-30%; bottom:0; width:30%;
    background:linear-gradient(90deg,transparent,rgba(120,180,255,0.22),transparent);
    animation:pulseRight 2.8s linear infinite;
    pointer-events:none;
  }
  @keyframes pulseRight { to { left:110%; } }

  /* Neural network */
  .nn-card { position:relative; }
  .nn-wrap { flex:1; min-height:0; padding:4px 8px; }
  .nn-wrap svg { width:100%; height:100%; display:block; }

  /* Outputs list */
  .outputs-list {
    padding:10px; display:flex; flex-direction:column; gap:7px; flex:1;
  }
  .output-row {
    padding:8px 12px;
    background:rgba(80,220,140,0.07);
    border:1px solid rgba(120,240,180,0.3);
    border-radius:6px;
    display:flex; flex-direction:column; gap:2px;
    position:relative;
    overflow:hidden;
  }
  .output-row .oname {
    font-size:10px; letter-spacing:1.2px; color:#80ffb0;
  }
  .output-row .oval {
    font-size:18px; font-weight:700; color:#c0e878;
    font-variant-numeric:tabular-nums; line-height:1.1;
    text-shadow:0 0 8px rgba(150,220,80,0.7);
    transition:color 0.2s;
  }
  .output-row .oconf {
    font-size:8.5px; letter-spacing:1px; color:rgba(180,240,200,0.6);
    display:flex; align-items:center; gap:5px;
  }
  .output-row .confbar {
    flex:1; height:2px; background:rgba(80,220,140,0.15); border-radius:1px; overflow:hidden;
  }
  .output-row .confbar-fill {
    height:100%; background:#80ffb0;
    box-shadow:0 0 5px rgba(80,220,140,0.7);
    transition:width 0.5s;
  }

  /* Mini grid */
  .mini-grid {
    display:grid;
    grid-template-columns:repeat(6, 1fr);
    gap:10px;
    flex-shrink:0;
    height:125px;
  }

  /* Climate strip — variables externas */
  .climate-strip {
    display:grid;
    grid-template-columns:repeat(6, 1fr);
    gap:10px;
    flex-shrink:0;
    height:92px;
  }
  .weather-tile {
    position:relative;
    background:rgba(2,8,25,0.78);
    border:1px solid rgba(80,200,255,0.38);
    border-radius:8px;
    padding:7px 10px 6px;
    display:flex; gap:10px; align-items:center;
    overflow:hidden;
    backdrop-filter:blur(10px);
    animation:fadeIn 0.6s ease-out forwards; opacity:0;
  }
  .weather-tile:nth-child(1) { animation-delay:0.85s; }
  .weather-tile:nth-child(2) { animation-delay:0.9s; }
  .weather-tile:nth-child(3) { animation-delay:0.95s; }
  .weather-tile:nth-child(4) { animation-delay:1.0s; }
  .weather-tile:nth-child(5) { animation-delay:1.05s; }
  .weather-tile:nth-child(6) { animation-delay:1.1s; }
  .weather-tile::before {
    content:''; position:absolute; top:0; left:8%; right:8%; height:1px;
    background:linear-gradient(90deg,transparent,rgba(120,210,255,0.9),transparent);
  }
  .weather-tile::after {
    content:''; position:absolute; top:0; bottom:0; left:-30%; width:30%;
    background:linear-gradient(90deg,transparent,rgba(80,200,255,0.08),transparent);
    animation:pulseRight 3.2s linear infinite;
    pointer-events:none;
  }
  .wicon {
    font-size:22px; line-height:1; flex-shrink:0;
    text-align:center; width:28px;
    filter:drop-shadow(0 0 6px rgba(120,210,255,0.6));
  }
  .winfo { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
  .wlabel {
    font-size:8.5px; letter-spacing:1.8px; color:rgba(180,220,255,0.7);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .wval {
    font-size:16px; font-weight:700; color:#a0d8ff;
    font-variant-numeric:tabular-nums; line-height:1.1;
    text-shadow:0 0 6px rgba(80,180,255,0.6);
  }
  .wspark { flex:1; min-width:0; }
  .wspark svg { width:100%; height:34px; display:block; }
  .climate-header {
    grid-column: 1 / -1;
    font-size:9px; letter-spacing:3px; color:#80d0ff;
    text-shadow:0 0 6px rgba(80,180,255,0.5);
    padding:2px 0 0 4px;
    display:flex; align-items:center; gap:10px;
    flex-shrink:0;
  }
  .climate-header .line {
    flex:1; height:1px;
    background:linear-gradient(90deg,rgba(80,200,255,0.5),transparent);
  }
  .climate-header .hd-led {
    width:7px; height:7px; border-radius:50%;
    background:#80d0ff; box-shadow:0 0 8px #80d0ff;
    animation:ledBlink 2s infinite;
  }
  .mini-chart {
    position:relative;
    background:rgba(2,8,25,0.78);
    border:1px solid rgba(140,80,220,0.35);
    border-radius:8px;
    padding:8px 10px 6px;
    display:flex; flex-direction:column;
    overflow:hidden;
    backdrop-filter:blur(10px);
    animation:fadeIn 0.6s ease-out forwards; opacity:0;
  }
  .mini-chart:nth-child(1) { animation-delay:0.55s; }
  .mini-chart:nth-child(2) { animation-delay:0.6s; }
  .mini-chart:nth-child(3) { animation-delay:0.65s; }
  .mini-chart:nth-child(4) { animation-delay:0.7s; }
  .mini-chart:nth-child(5) { animation-delay:0.75s; }
  .mini-chart:nth-child(6) { animation-delay:0.8s; }
  .mini-chart::before {
    content:''; position:absolute; top:0; left:8%; right:8%; height:1px;
    background:linear-gradient(90deg,transparent,rgba(210,150,255,0.7),transparent);
  }
  .mini-chart.alert { border-color:rgba(255,80,80,0.7); }
  .mini-chart.alert::before { background:linear-gradient(90deg,transparent,rgba(255,100,100,0.9),transparent); }
  .mini-chart.alert { animation:fadeIn 0.6s ease-out forwards, alertBox 1.6s 1.5s infinite; }
  @keyframes alertBox {
    0%,100% { box-shadow:0 0 0 rgba(255,80,80,0); }
    50% { box-shadow:0 0 18px rgba(255,80,80,0.55); }
  }
  .mini-chart .mh {
    display:flex; justify-content:space-between; align-items:center;
    font-size:9.5px; letter-spacing:1.5px;
    margin-bottom:2px;
  }
  .mini-chart .lt-id { color:#c080ff; font-weight:700; }
  .mini-chart.alert .lt-id { color:#ff5555; }
  .mini-chart .mval {
    color:#80b8ff; font-variant-numeric:tabular-nums; font-weight:700;
    text-shadow:0 0 4px rgba(120,180,255,0.6);
  }
  .mini-chart.alert .mval { color:#ff8080; text-shadow:0 0 4px rgba(255,100,100,0.7); }
  .mini-chart .mled {
    width:6px; height:6px; border-radius:50%; background:#80ffb0;
    box-shadow:0 0 4px #80ffb0;
  }
  .mini-chart.alert .mled { background:#ff5555; box-shadow:0 0 6px #ff5555; animation:ledBlink 0.6s infinite; }
  .mini-chart svg { width:100%; flex:1; min-height:0; }

  @media (max-width:1100px) {
    .main-row { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
    .stat-strip { grid-template-columns: repeat(3, 1fr); }
    .mini-grid { grid-template-columns: repeat(3, 1fr); height:auto; }
  }
</style>

<!-- Three.js background -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"

</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const canvas = document.getElementById('three-canvas');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0,0,30);
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0x000000, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 1.2, 0.3, 0.85);
bloom.threshold=0.1; bloom.strength=1.3; bloom.radius=0.7;
composer.addPass(bloom);

const N=2000, pGeo=new THREE.BufferGeometry();
const pPos=new Float32Array(N*3), pCol=new Float32Array(N*3), pVel=[];
for(let i=0;i<N;i++){
  const th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1), r=12+Math.random()*18;
  pPos[i*3]=r*Math.sin(ph)*Math.cos(th); pPos[i*3+1]=r*Math.sin(ph)*Math.sin(th); pPos[i*3+2]=r*Math.cos(ph)-5;
  pVel.push({th,ph,r,sp:0.08+Math.random()*0.25,dr:(Math.random()-0.5)*0.008});
  const c=Math.random();
  if(c<0.4){pCol[i*3]=0.55;pCol[i*3+1]=0.35;pCol[i*3+2]=0.95;}
  else if(c<0.7){pCol[i*3]=0.72;pCol[i*3+1]=0.5;pCol[i*3+2]=1;}
  else{pCol[i*3]=0.88;pCol[i*3+1]=0.75;pCol[i*3+2]=1;}
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol,3));
scene.add(new THREE.Points(pGeo, new THREE.PointsMaterial({size:0.09,vertexColors:true,transparent:true,opacity:0.65,blending:THREE.AdditiveBlending,depthWrite:false})));

const sG=new THREE.BufferGeometry(), sP=new Float32Array(1500*3);
for(let i=0;i<1500;i++){sP[i*3]=(Math.random()-.5)*200;sP[i*3+1]=(Math.random()-.5)*200;sP[i*3+2]=-30-Math.random()*100;}
sG.setAttribute('position', new THREE.BufferAttribute(sP,3));
scene.add(new THREE.Points(sG, new THREE.PointsMaterial({color:0x332255,size:0.08,transparent:true,opacity:0.35})));

const clk = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clk.getElapsedTime();
  const pa=pGeo.attributes.position.array;
  for(let i=0;i<N;i++){const v=pVel[i];v.th+=v.sp*0.003;v.ph+=v.dr;const r=v.r+Math.sin(t*0.35+i*0.01)*0.3;pa[i*3]=r*Math.sin(v.ph)*Math.cos(v.th);pa[i*3+1]=r*Math.sin(v.ph)*Math.sin(v.th);pa[i*3+2]=r*Math.cos(v.ph)-5;}
  pGeo.attributes.position.needsUpdate=true;
  camera.position.x=Math.sin(t*0.04)*1;camera.position.y=Math.sin(t*0.06)*0.7;camera.lookAt(0,0,0);
  composer.render();
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});
</script>

  { icon:'◷', name:'HORA DÍA',       fmt:v => v, gen:() => new Date().toLocaleTimeString().slice(0,5) }

const inList = document.getElementById('inputs-list');
inputsDef.forEach((inp, i) => {
  const row = document.createElement('div');

// ───── NEURAL NETWORK ─────
(function drawNN(){
  const svg = document.getElementById('nn-svg');
  const W = 800, H = 400;
  const inN = 7, midN = 8, outN = 5;
  const inX = 70, midX = 400, outX = 730;
  const padY = 45;
  const stepY = (n) => (H - padY * 2) / (n - 1);
  const layer = (n, x) => Array.from({length:n}, (_,i) => ({ x, y: padY + i * stepY(n) }));
  const L1 = layer(inN, inX);
  const L2 = layer(midN, midX);
  const L3 = layer(outN, outX);

  let html = '';

  // Layer labels
  html += `<text x="${inX}" y="22" text-anchor="middle" fill="#80b8ff" style="font-size:10px;letter-spacing:2.5px;font-family:'Courier New',monospace;font-weight:700;">INPUT</text>`;
  html += `<text x="${midX}" y="22" text-anchor="middle" fill="#c080ff" style="font-size:10px;letter-spacing:2.5px;font-family:'Courier New',monospace;font-weight:700;">LSTM · MEMORY</text>`;
  html += `<text x="${outX}" y="22" text-anchor="middle" fill="#80ffb0" style="font-size:10px;letter-spacing:2.5px;font-family:'Courier New',monospace;font-weight:700;">OUTPUT</text>`;

  // Connections L1→L2
  L1.forEach(a => L2.forEach(b => {
    html += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="rgba(140,80,220,0.08)" stroke-width="1"/>`;
  }));
  // Connections L2→L3
  L2.forEach(a => L3.forEach(b => {
    html += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="rgba(140,80,220,0.1)" stroke-width="1"/>`;
  }));

  // Particles L1→L2 (cyan/blue data tokens)
  for (let i = 0; i < 25; i++) {
    const a = L1[Math.floor(Math.random() * inN)];
    const b = L2[Math.floor(Math.random() * midN)];
    const dur = 2 + Math.random() * 1.5;
    const del = Math.random() * 3;
    html += `<circle r="3" fill="#80b8ff" style="filter:drop-shadow(0 0 5px rgba(120,180,255,0.9));">
      <animateMotion dur="${dur}s" begin="${del}s" repeatCount="indefinite" path="M ${a.x} ${a.y} L ${b.x} ${b.y}"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="${dur}s" begin="${del}s" repeatCount="indefinite"/>
    </circle>`;
  }
  // Particles L2→L3 (green, outputs)
  for (let i = 0; i < 18; i++) {
    const a = L2[Math.floor(Math.random() * midN)];
    const b = L3[Math.floor(Math.random() * outN)];
    const dur = 1.8 + Math.random() * 1.2;
    const del = 0.8 + Math.random() * 2.8;
    html += `<circle r="3" fill="#80ffb0" style="filter:drop-shadow(0 0 5px rgba(80,220,120,0.9));">
      <animateMotion dur="${dur}s" begin="${del}s" repeatCount="indefinite" path="M ${a.x} ${a.y} L ${b.x} ${b.y}"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="${dur}s" begin="${del}s" repeatCount="indefinite"/>
    </circle>`;
  }

  // Input nodes (blue circles)
  L1.forEach((p, i) => {
    html += `<circle cx="${p.x}" cy="${p.y}" r="9" fill="#2a4a90" stroke="#80b8ff" stroke-width="2" style="filter:drop-shadow(0 0 8px rgba(120,180,255,0.8));">
      <animate attributeName="r" values="9;11.5;9" dur="${2 + i * 0.18}s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="${2 + i * 0.18}s" repeatCount="indefinite"/>
    </circle>`;
  });
  // LSTM cells (rectangular with inner glow)
  L2.forEach((p, i) => {
    html += `<rect x="${p.x - 22}" y="${p.y - 14}" width="44" height="28" rx="5" fill="#3a1c68" stroke="#c080ff" stroke-width="2" style="filter:drop-shadow(0 0 10px rgba(180,120,255,0.7));">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="${1.3 + i * 0.13}s" repeatCount="indefinite"/>
    </rect>
    <text x="${p.x}" y="${p.y + 3}" text-anchor="middle" fill="#e8d4ff" style="font-size:9px;font-family:'Courier New',monospace;font-weight:700;letter-spacing:0.5px;">LSTM</text>
    <circle cx="${p.x - 16}" cy="${p.y + 8}" r="1.5" fill="#ffc060" style="filter:drop-shadow(0 0 3px rgba(255,200,80,0.9));">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="${0.8 + Math.random()}s" repeatCount="indefinite"/>
    </circle>`;
  });
  // Output nodes (green circles)
  L3.forEach((p, i) => {
    html += `<circle cx="${p.x}" cy="${p.y}" r="10" fill="#1f5a3a" stroke="#80ffb0" stroke-width="2" style="filter:drop-shadow(0 0 10px rgba(80,220,120,0.9));">
      <animate attributeName="r" values="10;13;10" dur="${2.3 + i * 0.25}s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="${2.3 + i * 0.25}s" repeatCount="indefinite"/>
    </circle>`;
  });

  svg.innerHTML = html;
})();

// ───── MINI CHARTS (live random walk) ─────
const feeders = [
  { id:'LT-17', base:485, range:60, alert:false },
  { id:'LT-22', base:312, range:45, alert:false },
  { id:'LT-05', base:578, range:75, alert:false },
  { id:'LT-41', base:224, range:40, alert:true  },  // esta parpadea
  { id:'LT-33', base:398, range:55, alert:false },
  { id:'LT-19', base:512, range:70, alert:false }
];
const grid = document.getElementById('mini-grid');
const chartData = feeders.map(f => {
  let arr = [], v = f.base;
  for (let i = 0; i < 36; i++) {
    v += (Math.random() - 0.5) * 12;
    v = Math.max(f.base - f.range, Math.min(f.base + f.range, v));
    arr.push(v);
  }
  return arr;
});
feeders.forEach((f, i) => {
  const el = document.createElement('div');
  el.className = 'mini-chart' + (f.alert ? ' alert' : '');
  el.innerHTML = `
    <div class="mh">
      <span class="lt-id">${f.id}</span>
      <span class="mval" id="mval-${i}">--</span>
      <div class="mled"></div>
    </div>
    <svg viewBox="0 0 200 60" preserveAspectRatio="none" id="msvg-${i}"></svg>
  `;
  grid.appendChild(el);
});

function drawMini(i){
  const f = feeders[i];
  const svg = document.getElementById('msvg-' + i);
  const data = chartData[i];
  const maxV = Math.max(...data), minV = Math.min(...data);
  const range = (maxV - minV) || 1;
  const W = 200, H = 60;
  const pad = 4;
  const stepX = (W - pad * 2) / (data.length - 1);
  const pts = data.map((v, idx) => {
    const x = pad + idx * stepX;
    const y = pad + (H - pad * 2) * (1 - (v - minV) / range);
    return `${x},${y}`;
  }).join(' ');
  // Proyección (dashed, 6 últimos extendidos con leve shift)
  const predPts = data.slice(-12).map((v, idx) => {
    const realIdx = data.length - 12 + idx;
    const x = pad + realIdx * stepX;
    const shift = (Math.sin(idx * 0.3) * range * 0.05);
    const y = pad + (H - pad * 2) * (1 - (v + shift - minV) / range);
    return `${x},${y}`;
  }).join(' ');
  const color = f.alert ? '#ff5555' : '#80b8ff';
  const predColor = f.alert ? '#ffaaaa' : '#d0a0ff';
  svg.innerHTML = `
    <polyline points="${predPts}" fill="none" stroke="${predColor}" stroke-width="1.4" stroke-dasharray="3 3" opacity="0.8"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8"
              style="filter:drop-shadow(0 0 3px ${color});"/>
  `;
  const last = data[data.length-1];
  document.getElementById('mval-' + i).textContent = last.toFixed(0) + ' A';
}
feeders.forEach((_, i) => drawMini(i));

function tickMini(){
  chartData.forEach((arr, i) => {
    arr.shift();
    let last = arr[arr.length - 1];
    last += (Math.random() - 0.5) * 12;
    const f = feeders[i];
    last = Math.max(f.base - f.range, Math.min(f.base + f.range, last));
    if (f.alert && Math.random() < 0.14) last += (Math.random() - 0.2) * 60;
    arr.push(last);
    drawMini(i);
  });
}
setInterval(tickMini, 750);
