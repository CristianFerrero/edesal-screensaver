name: Update Cloudflare stats

on:
  schedule:
    - cron: '7-59/10 * * * *'   # cada 10 min con offset 7: :07, :17, :27... (esquiva el pico :00)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudflare-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Cloudflare GraphQL
        run: node scripts/fetch-cloudflare.mjs
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID:    ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Commit & push if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add cloudflare-stats.json
          if git diff --staged --quiet; then
            echo 'sin cambios — no commit'
          else
            git commit -m 'chore(cf): refresh stats [skip ci]'
            git push
          fi
