<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100vh; width:100vw; overflow:hidden; }
  body { background:#000; color:#fff; font-family:'Courier New',monospace; }

    position:fixed; top:15px; right:20px; z-index:30;

  }

  .brand-mark .brand-title {
    font-size:12px; color:#f5821e; font-weight:700; letter-spacing:5px;
    text-shadow:0 0 8px rgba(245,130,30,0.6);
  }

  .dashboard {
    position:relative; z-index:10;
    height:100vh;
    max-width:1900px;
    margin:0 auto;
    padding:42px 22px 18px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  /* Header */
  .header { text-align:center; flex-shrink:0; animation:fadeIn 1.2s ease-out forwards; opacity:0; }
  @keyframes fadeIn { to { opacity:1; } }
  .header h1 {
    font-size:28px; letter-spacing:7px; font-weight:700;
    color:#f5821e;
    text-shadow:0 0 20px rgba(245,130,30,0.7), 0 0 40px rgba(245,130,30,0.4);

  .header .subtitle {
    font-size:10.5px; letter-spacing:3.5px;

  .header .divider {
    width:80px; height:2px; margin:8px auto 0;

  .stat-strip {
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:12px;
    flex-shrink:0;

  .stat-tile {
    position:relative;
    padding:11px 16px;
    background:rgba(2,8,25,0.78);
    border:1px solid rgba(245,130,30,0.45);
    border-radius:10px;
    overflow:hidden;
    display:flex; align-items:center; gap:14px;
    backdrop-filter:blur(10px);
    animation:cardIn 0.6s ease-out forwards; opacity:0; transform:translateY(8px);
  }
  .stat-tile:nth-child(1) { animation-delay:0.05s; }
  .stat-tile:nth-child(2) { animation-delay:0.12s; }
  .stat-tile:nth-child(3) { animation-delay:0.19s; }
  .stat-tile:nth-child(4) { animation-delay:0.26s; }
  @keyframes cardIn { to { opacity:1; transform:translateY(0); } }
  .stat-tile::before {
    content:''; position:absolute; top:0; left:8%; right:8%; height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,180,100,0.95),transparent);
  }
  .stat-tile .led {
    width:10px; height:10px; border-radius:50%;
    box-shadow:0 0 10px currentColor;
    animation:ledBlink 1.6s infinite;
    flex-shrink:0;

  @keyframes ledBlink { 50% { opacity:0.3; } }
  .stat-tile.danger .led { background:#ff5555; color:#ff5555; }
  .stat-tile.warn   .led { background:#ffc060; color:#ffc060; }
  .stat-tile.ok     .led { background:#80ffb0; color:#80ffb0; }
  .stat-tile.brand  .led { background:#f5821e; color:#f5821e; }
  .stat-tile .tbody { flex:1; min-width:0; }
  .stat-tile .label { font-size:9px; letter-spacing:2.5px; color:rgba(255,180,100,0.7); margin-bottom:3px; }
  .stat-tile .value {
    font-size:26px; font-weight:700; line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .stat-tile.danger .value { color:#ff8080; text-shadow:0 0 10px rgba(255,80,80,0.7); }
  .stat-tile.warn   .value { color:#ffc060; text-shadow:0 0 10px rgba(255,180,60,0.7); }

  .stat-tile.brand  .value { color:#f5821e; text-shadow:0 0 10px rgba(245,130,30,0.7); }

    flex:1;

    grid-template-columns: 1.85fr 1fr;

  .target-label { fill:#80ffb0; font-size:13px; font-weight:700; font-family:'Courier New',monospace; letter-spacing:1.5px;
                  text-shadow:0 0 6px rgba(80,220,120,0.7); }
  .arc-line { fill:none; stroke-linecap:round; }
  .arc-particle { filter:drop-shadow(0 0 6px currentColor); }

  /* Ranking */

    flex:1; min-height:0;

  .country-row {
    position:absolute;

    height:30px;
    display:grid;
    grid-template-columns: 26px 100px 1fr 56px;
    align-items:center;

    background:rgba(245,130,30,0.05);

  .country-row.flash {

  .country-row .flag { font-size:18px; line-height:1; }
  .country-row .cinfo {
    display:flex; flex-direction:column; line-height:1.1;
    overflow:hidden;
  }
  .country-row .cc {
    font-size:11px; font-weight:700; color:#ffb060;

  .country-row .cname {
    font-size:8.5px; color:rgba(255,200,150,0.6);

  .country-row .barwrap {

  @media (max-width:1200px) {
    .main-row { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .stat-strip { grid-template-columns: repeat(2, 1fr); }
  }
</style>

{
  "imports": {

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const canvas = document.getElementById('three-canvas');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0,0,30);
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0x000000, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 1.2, 0.3, 0.85);
bloom.threshold=0.1; bloom.strength=1.2; bloom.radius=0.7;
composer.addPass(bloom);

const N=1500, pGeo=new THREE.BufferGeometry();
const pPos=new Float32Array(N*3), pCol=new Float32Array(N*3), pVel=[];
for(let i=0;i<N;i++){
  const th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1), r=12+Math.random()*18;
  pPos[i*3]=r*Math.sin(ph)*Math.cos(th); pPos[i*3+1]=r*Math.sin(ph)*Math.sin(th); pPos[i*3+2]=r*Math.cos(ph)-5;
  pVel.push({th,ph,r,sp:0.06+Math.random()*0.2,dr:(Math.random()-0.5)*0.006});
  const c=Math.random();
  if(c<0.5){pCol[i*3]=0.96;pCol[i*3+1]=0.5;pCol[i*3+2]=0.12;}
  else if(c<0.8){pCol[i*3]=1;pCol[i*3+1]=0.7;pCol[i*3+2]=0.4;}
  else{pCol[i*3]=1;pCol[i*3+1]=0.95;pCol[i*3+2]=0.85;}
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol,3));
scene.add(new THREE.Points(pGeo, new THREE.PointsMaterial({size:0.08,vertexColors:true,transparent:true,opacity:0.55,blending:THREE.AdditiveBlending,depthWrite:false})));

const sG=new THREE.BufferGeometry(), sP=new Float32Array(1500*3);
for(let i=0;i<1500;i++){sP[i*3]=(Math.random()-.5)*200;sP[i*3+1]=(Math.random()-.5)*200;sP[i*3+2]=-30-Math.random()*100;}
sG.setAttribute('position', new THREE.BufferAttribute(sP,3));
scene.add(new THREE.Points(sG, new THREE.PointsMaterial({color:0x442211,size:0.08,transparent:true,opacity:0.4})));

const clk = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clk.getElapsedTime();
  const pa=pGeo.attributes.position.array;
  for(let i=0;i<N;i++){const v=pVel[i];v.th+=v.sp*0.003;v.ph+=v.dr;const r=v.r+Math.sin(t*0.3+i*0.01)*0.3;pa[i*3]=r*Math.sin(v.ph)*Math.cos(v.th);pa[i*3+1]=r*Math.sin(v.ph)*Math.sin(v.th);pa[i*3+2]=r*Math.cos(v.ph)-5;}
  pGeo.attributes.position.needsUpdate=true;
  composer.render();
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});
</script>

<!-- Map + attacks simulation -->
<script type="module">
const SVG_NS = 'http://www.w3.org/2000/svg';
const map = document.getElementById('map');

// Equirectangular projection: viewBox 2000 x 1000
function project(lon, lat) {
  return { x: (lon + 180) * (2000 / 360), y: (90 - lat) * (1000 / 180) };
}

// Continentes: se cargan via d3-geo + world-atlas (forma real de los continentes)
// El path se inyecta dinámicamente en #land-path (más abajo, en el módulo)

// URL del JSON con datos reales (lo escribe el workflow cada 10 min). Vacío = mock.
const CF_STATS_URL = 'cloudflare-stats.json';

// Países atacantes (FALLBACK / MOCK si no hay datos reales aún)
const countries = [
  { code:'CN', name:'CHINA',         flag:'🇨🇳', lat:39.9, lon:116.4, weight:22 },
  { code:'RU', name:'RUSIA',         flag:'🇷🇺', lat:55.75,lon:37.6,  weight:18 },
  { code:'US', name:'EE.UU.',        flag:'🇺🇸', lat:38.9, lon:-77.0, weight:13 },
  { code:'KP', name:'COREA NORTE',   flag:'🇰🇵', lat:39.0, lon:125.7, weight:8  },
  { code:'IR', name:'IRÁN',          flag:'🇮🇷', lat:35.7, lon:51.4,  weight:7  },
  { code:'BR', name:'BRASIL',        flag:'🇧🇷', lat:-23.5,lon:-46.6, weight:6  },
  { code:'IN', name:'INDIA',         flag:'🇮🇳', lat:28.6, lon:77.2,  weight:6  },
  { code:'VN', name:'VIETNAM',       flag:'🇻🇳', lat:21.0, lon:105.8, weight:5  },
  { code:'RO', name:'RUMANIA',       flag:'🇷🇴', lat:44.4, lon:26.1,  weight:5  },
  { code:'UA', name:'UCRANIA',       flag:'🇺🇦', lat:50.4, lon:30.5,  weight:4  },
  { code:'DE', name:'ALEMANIA',      flag:'🇩🇪', lat:52.5, lon:13.4,  weight:3  },
  { code:'NL', name:'PAÍSES BAJOS',  flag:'🇳🇱', lat:52.4, lon:4.9,   weight:3  }
];

// Si hay cloudflare-stats.json con datos reales, reemplaza la lista mock de countries.
// Esta función se llama DESPUÉS del init si falla — los países iniciales son mock.
async function tryLoadCfData() {
  if (!CF_STATS_URL) return false;
  try {
    const r = await fetch(`${CF_STATS_URL}?_=${Date.now()}`);
    if (!r.ok) return false;
    const data = await r.json();
    if (!data._meta?.ok || !Array.isArray(data.byCountry) || data.byCountry.length < 3) return false;

    countries.length = 0;
    data.byCountry.slice(0, 15).forEach(c => countries.push({
      code:c.code, name:c.name, flag:c.flag, lat:c.lat, lon:c.lon,
      weight: Math.max(1, c.weight || Math.round((c.count || 1) / 50)),
      initialCount: c.count || 0   // se preserva — el siguiente forEach NO lo va a resetear
    }));

    // Actualizar total bloqueados
    if (typeof data.totalBlocked === 'number') {
      const el = document.getElementById('stat-blocked');
      if (el) el.textContent = data.totalBlocked.toLocaleString('es-AR');
      window._cfBaseTotal = data.totalBlocked;
    }
    console.log('[CF] datos reales cargados:', data.byCountry.length, 'países, total bloqueados', data.totalBlocked);
    return true;
  } catch (e) {
    console.warn('[CF] no se pudo cargar cloudflare-stats.json, usando mock:', e.message);
    return false;
  }
}

// Esperamos al fetch antes de proyectar y dibujar el mapa.
// Como esto es top-level y ya estamos en script type="module"-friendly context, lo envolvemos.
await tryLoadCfData().catch(() => {});

countries.forEach(c => { c.proj = project(c.lon, c.lat); c.count = c.initialCount || 0; });

// Target: SAN LUIS, ARGENTINA
const target = project(-66.3, -33.3);

// ───── DRAW STATIC MAP ─────
let mapHtml = '';

// Background grid
mapHtml += '<g class="map-bg-grid">';
for (let lon = -180; lon <= 180; lon += 30) {
  const x = (lon + 180) * (2000/360);
  mapHtml += `<line x1="${x}" y1="0" x2="${x}" y2="1000"/>`;
}
for (let lat = -60; lat <= 60; lat += 30) {
  const y = (90 - lat) * (1000/180);
  mapHtml += `<line x1="0" y1="${y}" x2="2000" y2="${y}"/>`;
}
mapHtml += '</g>';

// Continentes — placeholder, se llena en otro script con d3-geo + world-atlas
mapHtml += '<path id="land-path" class="continent" d="" style="opacity:0; transition:opacity 1.2s;"/>';

// Country markers + labels
countries.forEach(c => {
  const { x, y } = c.proj;
  mapHtml += `<g class="cmark" id="mark-${c.code}">
    <circle cx="${x}" cy="${y}" r="4.5" class="country-marker">
      <animate attributeName="r" values="4.5;6;4.5" dur="${2 + Math.random()}s" repeatCount="indefinite"/>
    </circle>
    <text x="${x + 8}" y="${y + 4}" class="country-label">${c.code}</text>
  </g>`;
});

// Target San Luis (concentric pulse rings)
mapHtml += `<g>
  <circle cx="${target.x}" cy="${target.y}" r="6" class="target-core" style="filter:drop-shadow(0 0 8px rgba(80,220,120,0.9));"/>
  <circle cx="${target.x}" cy="${target.y}" r="14" class="target-ring" opacity="0.6">
    <animate attributeName="r" values="14;28;14" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0;0.7" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="${target.x}" cy="${target.y}" r="20" class="target-ring" opacity="0.4">
    <animate attributeName="r" values="20;38;20" dur="2.5s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="2.5s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <text x="${target.x + 16}" y="${target.y + 5}" class="target-label">SAN LUIS · AR</text>
</g>`;

// Layer for arcs (added dynamically)
mapHtml += '<g id="arcs-layer"></g>';
// Layer for blocked badges
mapHtml += '<g id="blocked-layer"></g>';

map.innerHTML = mapHtml;

// ───── ARCS / ATTACKS ─────
function arcPath(s, e) {
  const mx = (s.x + e.x) / 2, my = (s.y + e.y) / 2;
  const dx = e.x - s.x, dy = e.y - s.y;
  const dist = Math.hypot(dx, dy);
  let perpX = -dy / dist, perpY = dx / dist;
  if (perpY > 0) { perpX = -perpX; perpY = -perpY; }
  const bulge = dist * 0.32;
  return { d:`M ${s.x} ${s.y} Q ${mx + perpX*bulge} ${my + perpY*bulge} ${e.x} ${e.y}`,
           cx:mx + perpX*bulge, cy:my + perpY*bulge };
}

const arcsLayer = document.getElementById('arcs-layer');
const blockedLayer = document.getElementById('blocked-layer');

function spawnAttack() {
  // Pick country weighted
  const totalW = countries.reduce((s,c) => s + c.weight, 0);
  let r = Math.random() * totalW;
  let chosen = countries[0];
  for (const c of countries) { r -= c.weight; if (r <= 0) { chosen = c; break; } }

  const arc = arcPath(chosen.proj, target);
  const drawDur = 1.4;

  // Create arc group
  const g = document.createElementNS(SVG_NS, 'g');
  // Linea
  const path = document.createElementNS(SVG_NS, 'path');
  path.setAttribute('d', arc.d);
  path.setAttribute('class', 'arc-line');
  path.setAttribute('stroke', '#f5821e');
  path.setAttribute('stroke-width', '2.2');
  path.setAttribute('stroke-opacity', '0.9');
  path.setAttribute('fill', 'none');
  path.style.filter = 'drop-shadow(0 0 6px rgba(245,130,30,0.9))';
  g.appendChild(path);
  arcsLayer.appendChild(g);

  // Animate stroke draw
  const len = path.getTotalLength();
  path.style.strokeDasharray = len;
  path.style.strokeDashoffset = len;
  path.style.transition = `stroke-dashoffset ${drawDur}s cubic-bezier(0.4, 0.0, 0.2, 1)`;
  // force reflow
  void path.getBoundingClientRect();
  path.style.strokeDashoffset = 0;

  // Particle moving along the arc
  const particle = document.createElementNS(SVG_NS, 'circle');
  particle.setAttribute('r', '5');
  particle.setAttribute('fill', '#ffcc60');
  particle.setAttribute('class', 'arc-particle');
  particle.style.color = '#ffcc60';
  g.appendChild(particle);

  const animateMotion = document.createElementNS(SVG_NS, 'animateMotion');
  animateMotion.setAttribute('dur', drawDur + 's');
  animateMotion.setAttribute('repeatCount', '1');
  animateMotion.setAttribute('fill', 'freeze');
  animateMotion.setAttribute('path', arc.d);
  particle.appendChild(animateMotion);
  animateMotion.beginElement();

  // After arrival: BLOCKED flash + count increment
  setTimeout(() => {
    // BLOCKED text
    const blocked = document.createElementNS(SVG_NS, 'text');
    blocked.setAttribute('x', target.x + 16);
    blocked.setAttribute('y', target.y - 22);
    blocked.setAttribute('fill', '#80ffb0');
    blocked.style.fontSize = '14px';
    blocked.style.fontFamily = "'Courier New',monospace";
    blocked.style.fontWeight = '700';
    blocked.style.letterSpacing = '2px';
    blocked.style.textShadow = '0 0 10px rgba(80,220,120,0.9)';
    blocked.textContent = 'BLOCKED';
    blockedLayer.appendChild(blocked);

    // Pulse explosion
    const pulse = document.createElementNS(SVG_NS, 'circle');
    pulse.setAttribute('cx', target.x);
    pulse.setAttribute('cy', target.y);
    pulse.setAttribute('r', '6');
    pulse.setAttribute('fill', 'none');
    pulse.setAttribute('stroke', '#80ffb0');
    pulse.setAttribute('stroke-width', '3');
    pulse.style.filter = 'drop-shadow(0 0 8px rgba(80,220,120,1))';
    blockedLayer.appendChild(pulse);
    pulse.animate(
      [{ r:6, opacity:0.95, strokeWidth:3 }, { r:42, opacity:0, strokeWidth:1 }],
      { duration:900, easing:'cubic-bezier(0.4,0,0.2,1)' }
    );
    setTimeout(() => pulse.remove(), 950);

    blocked.animate(
      [{ opacity:0, transform:'translateY(0px)' }, { opacity:1, transform:'translateY(-3px)' }, { opacity:0, transform:'translateY(-12px)' }],
      { duration:1100, easing:'ease-out' }
    );
    setTimeout(() => blocked.remove(), 1150);

    // Increment counts
    chosen.count++;
    totalAttacks++;
    rateBuffer.push(Date.now());
    flashCountryRow(chosen.code);
    updateRanking();
    const baseTotal = window._cfBaseTotal || 47328;
    document.getElementById('stat-blocked').textContent = (baseTotal + totalAttacks).toLocaleString('es-AR');
  }, drawDur * 1000);

  // Cleanup arc after fade
  setTimeout(() => {
    path.style.transition = 'stroke-opacity 0.8s, opacity 0.8s';
    path.style.strokeOpacity = '0';
    particle.style.opacity = '0';
    setTimeout(() => g.remove(), 900);
  }, drawDur * 1000 + 200);
}

// ───── RANKING PANEL ─────
const rankList = document.getElementById('ranking-list');
const ROW_H = 34;
countries.forEach(c => {
  const row = document.createElement('div');
  row.className = 'country-row';
  row.id = 'row-' + c.code;
  row.innerHTML = `
    <div class="flag">${c.flag}</div>
    <div class="cinfo">
      <div class="cc">${c.code}</div>
      <div class="cname">${c.name}</div>
    </div>
    <div class="barwrap"><div class="barfill" id="bar-${c.code}" style="width:0%"></div></div>
    <div class="ccount" id="cnt-${c.code}">0</div>
  `;
  rankList.appendChild(row);
});

function flashCountryRow(code) {
  const row = document.getElementById('row-' + code);
  if (!row) return;
  row.classList.add('flash');
  setTimeout(() => row.classList.remove('flash'), 600);
}

function updateRanking() {
  const sorted = [...countries].sort((a, b) => b.count - a.count);
  const max = Math.max(1, sorted[0].count);
  sorted.forEach((c, i) => {
    const row = document.getElementById('row-' + c.code);
    row.style.top = (i * ROW_H) + 'px';
    document.getElementById('cnt-' + c.code).textContent = c.count;
    document.getElementById('bar-' + c.code).style.width = ((c.count / max) * 100) + '%';
  });
}

// Initial layout — usa updateRanking para ordenar por count real desde CF data
updateRanking();

// Si tenemos baseTotal de CF, mostrarlo en el contador grande arriba
if (window._cfBaseTotal) {
  document.getElementById('stat-blocked').textContent = window._cfBaseTotal.toLocaleString('es-AR');
}

// ───── STATS ─────
let totalAttacks = 0;
const rateBuffer = [];   // timestamps of recent attacks
function updateRate() {
  const now = Date.now();
  while (rateBuffer.length && now - rateBuffer[0] > 60000) rateBuffer.shift();
  document.getElementById('stat-rate').textContent = rateBuffer.length;
  // active countries: those with attacks in last 60s
  // Simplification: count countries with count > 0 (cumulative)
  const active = countries.filter(c => c.count > 0).length;
  document.getElementById('stat-countries').textContent = Math.min(active, 12);
}
setInterval(updateRate, 1000);

// ───── ATTACK SCHEDULER · oleadas simultáneas ─────
// Cada wave dispara 3-6 ataques en paralelo (con leve stagger 0-350ms para que no se superpongan exacto)
function spawnWave() {
  const count = 3 + Math.floor(Math.random() * 4);   // 3 a 6 ataques por wave
  for (let i = 0; i < count; i++) {
    setTimeout(() => spawnAttack(), Math.random() * 350);
  }
}
function scheduleNext() {
  spawnWave();
  const delay = 1200 + Math.random() * 1500;          // 1.2 a 2.7s entre oleadas
  setTimeout(scheduleNext, delay);
}
// Arranca la primera oleada apenas se carga
setTimeout(scheduleNext, 400);
</script>

<!-- Carga del mapamundi real desde world-atlas (Natural Earth simplificado) -->
<script type="module">
import * as topojson from 'https://cdn.jsdelivr.net/npm/topojson-client@3/+esm';
import { geoEquirectangular, geoPath } from 'https://cdn.jsdelivr.net/npm/d3-geo@3/+esm';

const proj = geoEquirectangular()
  .scale(2000 / (2 * Math.PI))
  .translate([1000, 500]);
const pathGen = geoPath(proj);

(async () => {
  try {
    const data = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/land-50m.json').then(r => r.json());
    const land = topojson.feature(data, data.objects.land);
    const d = pathGen(land);
    const el = document.getElementById('land-path');
    if (el && d) {
      el.setAttribute('d', d);
      requestAnimationFrame(() => { el.style.opacity = '1'; });
    }
  } catch (err) {
    console.warn('No se pudo cargar el mapamundi:', err);
  }
})();
</script>
